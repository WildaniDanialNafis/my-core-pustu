  +edit()
  +destroy()
  +ajax()
}

class GrafikBbTbLakiController extends Controller {
  +index()
  +dataGrafik()
  +grafik()
  +create()
  +store()
  +show()
  +edit()
  +update()
  +destroy()
}

@enduml

